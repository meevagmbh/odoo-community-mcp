name: Release

# main   -> ghcr.io/<owner>/odoo-community-mcp:edge
# vX.Y.Z -> :X.Y.Z, :X.Y, :latest + GitHub release with SBOMs, checksums and notes
#
# Supply-chain / EU Cyber Resilience Act evidence per release:
# - vulnerability gate: the image is scanned before it is pushed
# - SBOMs: image (SPDX + CycloneDX, via syft) and Python dependencies (CycloneDX, via uv)
# - SBOM and SLSA provenance attestations stored next to the image in GHCR
# - keyless Sigstore signature of the image digest
# - SHA-256 checksums of all release assets
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build, scan, sign and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless cosign signature and attestations
      attestations: write # store provenance and SBOM attestations
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once locally (no external cache) and gate on known vulnerabilities
      # before anything is published. The multi-arch build below reuses the
      # builder's local layer cache.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: odoo-community-mcp:scan

      - name: Vulnerability gate
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: odoo-community-mcp:scan
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Prepare release asset directory
        run: mkdir -p "$RUNNER_TEMP/assets"

      - name: Image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/assets/odoo-community-mcp-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Image SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/assets/odoo-community-mcp-image.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/assets/odoo-community-mcp-image.spdx.json
          push-to-registry: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"

      - name: Python dependency SBOM (CycloneDX, from uv.lock)
        run: |
          uv export --locked --no-dev --format cyclonedx1.5 --preview-features sbom-export \
            > "$RUNNER_TEMP/assets/odoo-community-mcp-python.cdx.json"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Keep release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Create release with SBOMs, checksums and notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${TAG#v}"
          cd assets
          printf '%s\n' "${IMAGE}@${DIGEST}" > image-digest.txt
          sha256sum -- * > SHA256SUMS
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Container image

          \`\`\`sh
          docker pull ${IMAGE}:${version}
          # pinned: ${IMAGE}@${DIGEST}
          \`\`\`

          ## Verify

          \`\`\`sh
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${GH_REPO}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GH_REPO}
          gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GH_REPO} \\
            --predicate-type https://spdx.dev/Document/v2.3
          sha256sum -c SHA256SUMS
          \`\`\`

          ## Software bill of materials

          | File | Content |
          |---|---|
          | \`odoo-community-mcp-image.spdx.json\` | Container image, SPDX 2.3 |
          | \`odoo-community-mcp-image.cdx.json\` | Container image, CycloneDX |
          | \`odoo-community-mcp-python.cdx.json\` | Python dependencies from \`uv.lock\`, CycloneDX 1.5 |

          Security support and vulnerability reporting: see [SECURITY.md](https://github.com/${GH_REPO}/blob/${TAG}/SECURITY.md).
          NOTES
          gh release create "$TAG" --verify-tag --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md" -- ./*
